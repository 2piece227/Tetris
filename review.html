<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI 리뷰 · 블럭아웃</title>
    <style>
      /* ─── Code entry ─────────────────────────────────────────────────────── */
      #entryScreen { display: flex; flex-direction: column; align-items: center; width: 100%; }
      .entry {
        display: flex; flex-direction: column; align-items: center; gap: 22px;
        width: 100%; max-width: 520px; padding: 36px 28px;
        background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
      }
      .entry label { color: var(--muted); font-size: 16px; }
      .digits { display: flex; gap: 12px; }
      .digits input {
        width: 72px; height: 92px; text-align: center; font-size: 48px; font-weight: 800;
        color: var(--text); background: var(--bg); border: 2px solid var(--line-hi); border-radius: 14px;
        font-family: inherit; caret-color: var(--accent);
      }
      .digits input:focus { outline: none; border-color: var(--accent); }
      .entry button {
        font-size: 18px; font-weight: 700; color: var(--accent-ink); background: var(--accent);
        border: none; border-radius: 10px; padding: 14px 34px; cursor: pointer; font-family: inherit;
      }
      .entry button:disabled { opacity: 0.4; cursor: default; }
      #status { min-height: 1.6em; color: var(--muted); font-size: 15px; text-align: center; line-height: 1.6; }
      .entry-note { color: var(--faint); font-size: 13.5px; margin-top: 18px; text-align: center; }

      /* ─── Report ─────────────────────────────────────────────────────────── */
      #report { display: none; }
      body.review-page.reporting { display: block; padding: 0; height: 100%; overflow: hidden; }
      body.reporting #entryScreen { display: none; }
      body.reporting #report { display: block; }

      #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }

      .glass {
        background: rgba(10,14,28,0.78); border: 1px solid rgba(124,139,255,0.2); border-radius: 16px;
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      }

      .side {
        position: fixed; top: 16px; left: 16px; bottom: 112px; width: 320px;
        overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 20px;
      }
      .side .top { display: flex; align-items: center; justify-content: space-between; }
      .side a.back { position: static; padding: 0; font-size: 13px; }
      .sample-badge {
        font-size: 11.5px; font-weight: 700; letter-spacing: 1px; color: #f0b64a;
        border: 1px solid rgba(240,182,74,0.5); border-radius: 6px; padding: 2px 8px;
      }
      .side h2 { font-size: 13px; color: var(--faint); font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; }

      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stat b { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
      .stat span { color: var(--muted); font-size: 12.5px; }

      .counts { display: flex; flex-wrap: wrap; gap: 6px; }
      .count {
        display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted);
        padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,0.04);
      }
      .count i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
      .count b { color: var(--text); font-variant-numeric: tabular-nums; }

      .meter { margin-bottom: 12px; }
      .meter .row1 { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
      .meter .row1 b { font-variant-numeric: tabular-nums; }
      .meter .row1 em { font-style: normal; font-size: 11px; color: #f0b64a; margin-left: 6px; }
      .bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,0.07); overflow: hidden; }
      .bar div { height: 100%; border-radius: 4px; background: var(--accent); }
      .meter p { color: var(--faint); font-size: 12px; margin-top: 5px; line-height: 1.5; }

      .moments { display: flex; flex-direction: column; gap: 8px; }
      .moments button {
        display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer;
        font: inherit; font-size: 14px; color: var(--text); padding: 10px 12px;
        background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 10px;
      }
      .moments button:hover:not(:disabled) { border-color: var(--accent); }
      .moments button:disabled { opacity: 0.35; cursor: default; }
      .moments button small { color: var(--faint); margin-left: auto; }

      .card {
        position: fixed; right: 16px; bottom: 112px; width: 380px; padding: 18px 20px;
      }
      .card .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
      .card .turn { color: var(--faint); font-size: 13px; font-weight: 700; }
      .card .piece { color: var(--muted); font-size: 13px; }
      .badge {
        font-size: 14px; font-weight: 800; padding: 3px 10px; border-radius: 8px; color: #05060a;
      }
      .card .lead { font-size: 17px; font-weight: 700; line-height: 1.5; }
      .card ul { list-style: none; margin-top: 8px; }
      .card li { color: var(--muted); font-size: 14px; line-height: 1.7; }
      .card .rank { color: var(--faint); font-size: 12.5px; margin-top: 10px; display: flex; justify-content: space-between; }
      .card .legend-hint { display: flex; gap: 14px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
      .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

      .timeline {
        position: fixed; left: 16px; right: 16px; bottom: 16px; height: 80px;
        display: flex; align-items: center; gap: 14px; padding: 0 16px;
      }
      .timeline > button {
        flex: none; width: 44px; height: 44px; border-radius: 10px; cursor: pointer;
        font-size: 18px; color: var(--text); background: rgba(255,255,255,0.05); border: 1px solid var(--line);
      }
      .timeline > button:hover { border-color: var(--accent); }
      .dots { flex: 1; display: flex; align-items: center; gap: 4px; overflow-x: auto; padding: 8px 2px; }
      .dot {
        flex: 1 0 14px; max-width: 30px; height: 26px; border-radius: 5px; cursor: pointer; border: 2px solid transparent;
        opacity: 0.55; transition: opacity 0.12s, transform 0.12s;
      }
      .dot:hover { opacity: 0.85; }
      .dot.on { opacity: 1; border-color: #fff; transform: scaleY(1.25); }
      .keys { flex: none; color: var(--faint); font-size: 12px; line-height: 1.7; text-align: right; }
      .keys kbd {
        font-family: inherit; font-size: 11px; color: var(--muted);
        border: 1px solid var(--line); border-radius: 4px; padding: 0 5px;
      }

      @media (max-width: 900px) {
        .side { bottom: auto; max-height: 38vh; width: auto; right: 16px; }
        .card { left: 16px; width: auto; }
        .keys { display: none; }
      }
    </style>
  </head>
  <body class="review-page">
    <div id="entryScreen">
      <a class="back" href="./">← 메뉴</a>

      <header class="title">
        <h1>AI 리뷰</h1>
        <p>VR 체험이 끝나면 화면에 나온 코드를 입력하세요</p>
      </header>

      <form class="entry" id="form" autocomplete="off">
        <label for="d0">리뷰 코드 4자리</label>
        <div class="digits">
          <input id="d0" inputmode="numeric" aria-label="첫째 자리" />
          <input inputmode="numeric" aria-label="둘째 자리" />
          <input inputmode="numeric" aria-label="셋째 자리" />
          <input inputmode="numeric" aria-label="넷째 자리" />
        </div>
        <button type="submit" id="submit" disabled>리뷰 보기</button>
        <div id="status" role="status"></div>
      </form>
      <p class="entry-note">기록 서버가 아직 없어서, 지금은 어떤 코드를 넣어도 샘플 판의 리뷰가 열려요.</p>
    </div>

    <div id="report">
      <canvas id="stage"></canvas>

      <aside class="side glass">
        <div class="top">
          <a class="back" href="./review.html">← 다른 코드</a>
          <span class="sample-badge" title="기록 서버와 엔진이 연결되기 전까지는 자동으로 만든 판을 보여줘요">샘플 데이터</span>
        </div>

        <section>
          <h2>요약</h2>
          <div class="stats">
            <div class="stat"><b id="sScore">0</b><span>점수</span></div>
            <div class="stat"><b id="sLayers">0</b><span>지운 층</span></div>
            <div class="stat"><b id="sAcc">0%</b><span>정확도</span></div>
          </div>
        </section>

        <section>
          <h2>수 평가</h2>
          <div class="counts" id="counts"></div>
        </section>

        <section>
          <h2>공간지각 지표</h2>
          <div id="meters"></div>
        </section>

        <section>
          <h2>핵심 장면</h2>
          <div class="moments" id="moments"></div>
        </section>
      </aside>

      <div class="card glass" id="card" aria-live="polite">
        <div class="head">
          <span class="turn" id="cTurn"></span>
          <span class="badge" id="cBadge"></span>
          <span class="piece" id="cPiece"></span>
        </div>
        <div class="lead" id="cLead"></div>
        <ul id="cFacts"></ul>
        <div class="legend-hint" id="cLegend">
          <span><i class="swatch" style="background:#ffffff"></i>내가 둔 자리</span>
          <span><i class="swatch" style="background:#2fd6e6"></i>AI 추천 (홀로그램)</span>
        </div>
        <div class="rank"><span id="cRank"></span><span id="cHint"></span></div>
      </div>

      <nav class="timeline glass" aria-label="수 이동">
        <button type="button" id="prev" aria-label="이전 수">◀</button>
        <div class="dots" id="dots"></div>
        <button type="button" id="next" aria-label="다음 수">▶</button>
        <div class="keys">
          <kbd>←</kbd><kbd>→</kbd> 한 수씩 · <kbd>Space</kbd> 추천 보기<br />
          마우스 드래그로 시점 돌리기 · 휠 확대
        </div>
      </nav>
    </div>

    <script type="module" src="/src/review/main.ts"></script>
  </body>
</html>
