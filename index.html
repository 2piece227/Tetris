<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>블럭아웃 · 3D 테트리스</title>
    <style>
      .modes {
        display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;
        width: 100%; max-width: 1040px;
      }
      .mode {
        display: flex; flex-direction: column; gap: 12px; padding: 28px 26px 26px;
        background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
        transition: border-color 0.12s, background 0.12s, transform 0.12s;
      }
      .mode:hover, .mode:focus-visible {
        border-color: var(--accent); background: var(--panel-hi); outline: none; transform: translateY(-2px);
      }
      .mode .step { color: var(--faint); font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .mode h2 { font-size: 26px; font-weight: 800; }
      .mode p { color: var(--muted); font-size: 15px; line-height: 1.6; flex: 1; }
      .mode .go {
        align-self: flex-start; margin-top: 6px; font-size: 15px; font-weight: 700;
        color: var(--accent-ink); background: var(--accent); padding: 10px 18px; border-radius: 10px;
      }
      .mode kbd {
        font-family: inherit; font-size: 12px; color: var(--faint);
        border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px;
      }
      .note { color: var(--faint); font-size: 13px; margin-top: 32px; text-align: center; }

      /* In the headset only VR is offered, so it gets the whole row. */
      body.headset .modes { grid-template-columns: minmax(0, 520px); justify-content: center; }
      body.headset .flat { display: none; }

      @media (max-width: 760px) {
        .modes { grid-template-columns: minmax(0, 1fr); }
      }
    </style>
  </head>
  <body>
    <header class="title">
      <h1>블럭아웃</h1>
      <p>3D 테트리스로 공간지각 연습하기</p>
    </header>

    <nav class="modes">
      <a class="mode" href="./vr.html" data-key="1">
        <span class="step">1단계 · 연습</span>
        <h2>VR 체험하기</h2>
        <p>헤드셋을 쓰고 수조를 직접 둘러보며 블록을 돌려 쌓아요. 끝나면 리뷰 코드가 나와요.</p>
        <span class="go">시작<kbd class="flat">1</kbd></span>
      </a>
      <a class="mode flat" href="./review.html" data-key="2">
        <span class="step">2단계 · 복기</span>
        <h2>AI 리뷰</h2>
        <p>VR에서 받은 4자리 코드를 입력하면 AI가 한 수씩 되짚어 줘요.</p>
        <span class="go">코드 입력<kbd>2</kbd></span>
      </a>
      <a class="mode flat" href="./versus.html" data-key="3">
        <span class="step">3단계 · 대결</span>
        <h2>AI와 대결하기</h2>
        <p>위에서 내려다보는 고정 시점. 보이지 않는 칸을 기억하며 AI와 1:1로 겨뤄요.</p>
        <span class="go">대결 시작<kbd>3</kbd></span>
      </a>
    </nav>

    <p class="note flat">VR 체험은 헤드셋 브라우저에서 열어 주세요. 이 화면에서 열면 키보드로 미리 해볼 수 있어요.</p>

    <script type="module" src="/src/menu/main.ts"></script>
  </body>
</html>
