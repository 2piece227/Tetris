<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI와 대결 · 블럭아웃</title>
    <style>
      body.versus-page { display: block; padding: 0; height: 100%; overflow: hidden; }
      html { height: 100%; overflow: hidden; }
      #renderCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

      .glass {
        background: rgba(10,14,28,0.72); border: 1px solid rgba(124,139,255,0.2); border-radius: 16px;
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      }
      .hud { position: fixed; inset: 0; pointer-events: none; }
      .hud .interactive { pointer-events: auto; }

      /* ─── Halves: the divider and the danger glow ───────────────────────── */
      .half { position: absolute; top: 0; bottom: 0; width: 50%; transition: box-shadow 0.3s; }
      #half0 { left: 0; } #half1 { right: 0; }
      .half.danger { animation: danger 1.1s ease-in-out infinite; }
      @keyframes danger {
        0%, 100% { box-shadow: inset 0 0 60px rgba(255,60,60,0.18); }
        50% { box-shadow: inset 0 0 120px rgba(255,60,60,0.42); }
      }
      .divider { position: absolute; left: 50%; top: 110px; bottom: 70px; width: 2px; margin-left: -1px; background: linear-gradient(transparent, #2b3766 15%, #2b3766 85%, transparent); }

      /* ─── Top bar ──────────────────────────────────────────────────────── */
      .top {
        position: absolute; top: 16px; left: 16px; right: 16px; height: 78px;
        display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
      }
      .player { display: flex; align-items: center; gap: 18px; padding: 10px 22px; height: 100%; }
      .player.right { flex-direction: row-reverse; text-align: right; }
      .player .who { display: flex; flex-direction: column; }
      .player .who b { font-size: 20px; font-weight: 800; letter-spacing: 1px; }
      .player .who span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
      .player .score { margin-left: auto; font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
      .player.right .score { margin-left: 0; margin-right: auto; }
      .player .chip { width: 10px; height: 38px; border-radius: 5px; }
      .player.left .chip { background: var(--accent); }
      .player.right .chip { background: #f0b64a; }
      .vs { font-size: 22px; font-weight: 900; letter-spacing: 3px; color: var(--faint); padding: 0 6px; }

      /* ─── Side panels: next piece and attack tally ─────────────────────── */
      .side { position: absolute; top: 112px; width: 156px; padding: 14px 16px 16px; }
      .side.s0 { left: 16px; } .side.s1 { right: 16px; }
      .side h3 { font-size: 12px; color: var(--faint); font-weight: 700; letter-spacing: 1.5px; margin-bottom: 8px; }
      .next { height: 96px; display: flex; align-items: center; justify-content: center; }
      .next svg { max-width: 112px; max-height: 92px; }
      .tally { margin-top: 14px; display: grid; gap: 6px; }
      .tally div { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--muted); }
      .tally b { color: var(--text); font-variant-numeric: tabular-nums; }

      /* ─── Gauges by the divider ────────────────────────────────────────── */
      .gauges { position: absolute; top: 50%; transform: translateY(-50%); display: flex; gap: 6px; align-items: flex-end; }
      .gauges.g0 { right: calc(50% + 12px); flex-direction: row-reverse; }
      .gauges.g1 { left: calc(50% + 12px); }
      .bar { display: flex; flex-direction: column; gap: 3px; }
      .bar .slot { width: 18px; height: clamp(14px, 3vh, 26px); border-radius: 4px; background: rgba(10,14,28,0.75); border: 1px solid #232c52; overflow: hidden; }
      .bar .slot.top { border-color: rgba(255,90,90,0.45); }
      .bar .fill { width: 100%; height: 100%; opacity: 0; transition: opacity 0.15s; }
      .attack .slot { width: 8px; border-color: rgba(255,90,90,0.18); background: rgba(10,14,28,0.5); transition: background 0.15s; }
      .attack .slot.on { background: #ff5a5a; border-color: #ff8a8a; }
      .attack.armed .slot.on { animation: pending 0.6s ease-in-out infinite alternate; }
      @keyframes pending { to { background: #ff9a7a; } }

      /* ─── Attack banners ───────────────────────────────────────────────── */
      .flash {
        position: absolute; top: 24%; width: 50%; text-align: center; opacity: 0;
        font-size: clamp(32px, 4.4vw, 60px); font-weight: 900; letter-spacing: 2px;
        text-shadow: 0 4px 24px rgba(0,0,0,0.7);
      }
      #flash0 { left: 0; } #flash1 { right: 0; }
      .flash.attack { color: #ffd166; }
      .flash.hit { color: #ff7b7b; }
      .flash.show { animation: rise 1.2s ease-out forwards; }
      @keyframes rise {
        0% { opacity: 0; transform: translateY(18px) scale(0.85); }
        15% { opacity: 1; transform: translateY(0) scale(1.08); }
        30% { transform: scale(1); }
        75% { opacity: 1; }
        100% { opacity: 0; transform: translateY(-28px); }
      }

      /* ─── Key legend ───────────────────────────────────────────────────── */
      .keys {
        position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 22px; align-items: center; padding: 10px 20px; white-space: nowrap;
        font-size: 13px; color: var(--muted);
      }
      .keys .grp { display: flex; align-items: center; gap: 6px; }
      kbd {
        display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 7px;
        font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--text);
        background: linear-gradient(#1d2547, #141a33); border: 1px solid #34407a; border-bottom-width: 3px; border-radius: 6px;
      }

      /* ─── Cards: start, countdown, result ──────────────────────────────── */
      .overlay {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px;
        background: rgba(4,6,12,0.62);
      }
      .overlay.show { display: flex; }
      .card { width: min(560px, 100%); padding: 34px 36px 30px; text-align: center; }
      .card h1 { font-size: 46px; font-weight: 900; letter-spacing: 3px; }
      .card .sub { color: var(--muted); font-size: 15.5px; line-height: 1.7; margin-top: 10px; }
      .card h2 { font-size: 12.5px; color: var(--faint); font-weight: 700; letter-spacing: 1.5px; margin: 26px 0 10px; }

      .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .levels button {
        font: inherit; color: var(--muted); cursor: pointer; padding: 12px 8px 10px; border-radius: 12px;
        background: rgba(255,255,255,0.04); border: 2px solid var(--line); transition: all 0.12s;
      }
      .levels button b { display: block; color: var(--text); font-size: 17px; margin-bottom: 2px; }
      .levels button small { font-size: 12px; }
      .levels button.on { border-color: var(--accent); background: rgba(124,139,255,0.14); }

      .map { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; text-align: left; align-items: center; justify-content: center; width: fit-content; margin: 0 auto; font-size: 14px; color: var(--muted); }
      .map .ks { display: flex; gap: 5px; }

      .actions { display: flex; gap: 10px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
      .actions button, .actions a {
        font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; padding: 13px 26px; border-radius: 11px;
        border: 1px solid var(--line-hi); color: var(--text); background: rgba(255,255,255,0.05);
        display: inline-flex; align-items: center; gap: 8px;
      }
      .actions .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      .actions kbd { height: 22px; min-width: 22px; font-size: 11px; color: inherit; background: rgba(0,0,0,0.15); border-color: rgba(0,0,0,0.25); }

      #count .num { font-size: 160px; font-weight: 900; color: var(--text); text-shadow: 0 8px 40px rgba(124,139,255,0.5); }
      #count .num.pop { animation: pop 0.7s ease-out; }
      @keyframes pop { 0% { transform: scale(1.6); opacity: 0; } 30% { transform: scale(1); opacity: 1; } 100% { opacity: 0.9; } }

      #result h1.win { color: #7cf0c0; }
      #result h1.lose { color: #ff7b7b; }
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 24px; }
      .stats div { padding: 12px 6px; border-radius: 12px; background: rgba(255,255,255,0.04); }
      .stats b { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
      .stats span { color: var(--muted); font-size: 12.5px; }

      @media (max-width: 900px) {
        .side { display: none; }
        .keys { display: none; }
        .player .score { font-size: 26px; }
      }
    </style>
  </head>
  <body class="versus-page">
    <canvas id="renderCanvas"></canvas>

    <div class="hud">
      <div class="half" id="half0"></div>
      <div class="half" id="half1"></div>
      <div class="divider"></div>

      <div class="top">
        <div class="player left glass">
          <i class="chip"></i>
          <div class="who"><b id="name0">나</b><span id="meta0">Lv 1 · 0층</span></div>
          <div class="score" id="score0">0</div>
        </div>
        <div class="vs">VS</div>
        <div class="player right glass">
          <i class="chip"></i>
          <div class="who"><b id="name1">AI</b><span id="meta1">Lv 1 · 0층</span></div>
          <div class="score" id="score1">0</div>
        </div>
      </div>

      <div class="side s0 glass">
        <h3>다음 조각</h3>
        <div class="next" id="next0"></div>
        <div class="tally">
          <div>보낸 공격 <b id="sent0">0</b></div>
          <div>받은 공격 <b id="recv0">0</b></div>
        </div>
      </div>
      <div class="side s1 glass">
        <h3>다음 조각</h3>
        <div class="next" id="next1"></div>
        <div class="tally">
          <div>보낸 공격 <b id="sent1">0</b></div>
          <div>받은 공격 <b id="recv1">0</b></div>
        </div>
      </div>

      <div class="gauges g0" title="높이 · 들어올 공격">
        <div class="bar" id="gauge0"></div>
        <div class="bar attack" id="attack0"></div>
      </div>
      <div class="gauges g1" title="높이 · 들어올 공격">
        <div class="bar" id="gauge1"></div>
        <div class="bar attack" id="attack1"></div>
      </div>

      <div class="flash" id="flash0"></div>
      <div class="flash" id="flash1"></div>

      <div class="keys glass">
        <span class="grp">이동 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
        <span class="grp">회전 <kbd>Q</kbd><kbd>E</kbd><kbd>R</kbd></span>
        <span class="grp">반대로 <kbd>Z</kbd><kbd>C</kbd><kbd>V</kbd></span>
        <span class="grp">떨구기 <kbd>Space</kbd></span>
      </div>
    </div>

    <div class="overlay show" id="start">
      <div class="card glass">
        <h1>AI와 대결</h1>
        <p class="sub">
          위에서 내려다보는 고정 시점이에요. 아래층은 기억으로 판단해야 해요.<br />
          층을 지우면 그만큼 상대 바닥에 층이 올라가요. 먼저 꼭대기에 닿으면 져요.
        </p>

        <h2>AI 난이도</h2>
        <div class="levels" id="levels">
          <button type="button" data-level="easy"><b>쉬움</b><small>천천히 둬요</small></button>
          <button type="button" data-level="normal"><b>보통</b><small>사람과 비슷하게</small></button>
          <button type="button" data-level="hard"><b>어려움</b><small>빠르고 쉼 없이</small></button>
        </div>

        <h2>조작</h2>
        <div class="map">
          <span>이동</span><span class="ks"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
          <span>회전</span><span class="ks"><kbd>Q</kbd><kbd>E</kbd><kbd>R</kbd> <span style="margin:0 4px">반대로</span> <kbd>Z</kbd><kbd>C</kbd><kbd>V</kbd></span>
          <span>떨구기</span><span class="ks"><kbd>Space</kbd></span>
        </div>

        <div class="actions">
          <a href="./"><kbd>Esc</kbd> 메뉴</a>
          <button type="button" class="primary" id="startBtn"><kbd>Space</kbd> 시작</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="count"><div class="num" id="countNum">3</div></div>

    <div class="overlay" id="result">
      <div class="card glass">
        <h1 id="resultTitle">승리!</h1>
        <p class="sub" id="resultSub"></p>
        <div class="stats">
          <div><b id="rLayers">0</b><span>지운 층</span></div>
          <div><b id="rSent">0</b><span>보낸 공격</span></div>
          <div><b id="rRecv">0</b><span>받은 공격</span></div>
          <div><b id="rTime">0:00</b><span>대결 시간</span></div>
        </div>
        <div class="actions">
          <button type="button" id="levelBtn"><kbd>Esc</kbd> 난이도 바꾸기</button>
          <button type="button" class="primary" id="restartBtn"><kbd>Space</kbd> 다시 하기</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/versus/main.ts"></script>
  </body>
</html>
